services:
  postgres:
    image: postgres:18-alpine3.21
    container_name: postgres
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: yu71
      POSTGRES_PASSWORD: 53ccret
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in /var/lib/postgresql/<major>/docker
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
